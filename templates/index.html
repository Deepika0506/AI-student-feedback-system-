<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Student Feedback System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body, html {
            height: 100%;
        }

        /* Fullscreen Image Container */
        .erp-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* Background Image */
        .erp-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* fills screen without distortion */
        }

        /* Dark overlay for readability */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
        }

        /* Top Right Buttons */
        .top-buttons {
            position: absolute;
            top: 20px;
            right: 30px;
            display: flex;
            gap: 15px;
            z-index: 2;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.3);
            transition: 0.3s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.4);
            color: #000;
        }

        /* Center Content */
        .center-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 2;
            padding: 20px;
        }

        .center-content h1 {
            font-size: 40px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .center-content p {
            font-size: 18px;
            opacity: 0.9;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .center-content h1 {
                font-size: 28px;
            }

            .center-content p {
                font-size: 14px;
            }

            .top-buttons {
                right: 15px;
            }
        }
    </style>
</head>

<body>

<div class="erp-container">

    <!-- Background Image -->
    <img src="{{ url_for('static', filename='frontimage.jpg') }}" alt="ERP Background">

    <!-- Overlay -->
    <div class="overlay"></div>

    <!-- Top Right Buttons -->
    <div class="top-buttons">
        <a href="/feedback" class="btn">Give Feedback</a>
        <a href="/view" class="btn">View Dashboard</a>
    </div>

    <!-- Center Text -->
    <div class="center-content">
        <h1>Welcome to AI-Based Feedback System</h1>
        <p>Empowering students to share insights and improve campus experience</p>
    </div>

</div>

</body>
</html>
