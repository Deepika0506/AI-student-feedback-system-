<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Feedback Portal</title>
    <style>
        body { margin:0; padding:0; background: linear-gradient(120deg, #eef2f7, #fdfefe); font-family: "Segoe UI", sans-serif; }
        .container { max-width: 1000px; margin: 40px auto; background: #ffffff; border-radius: 12px; box-shadow: 0 18px 35px rgba(0,0,0,0.15); overflow: hidden; }
        .header { background: #1abc9c; color: white; padding: 25px; text-align: center; }
        .header h2 { margin: 0; font-size: 26px; }
        .header p { margin-top: 6px; font-size: 14px; opacity: 0.9; }
        .form-body { padding: 35px 45px; }
        .row { display:flex; gap:20px; }
        .col { flex:1; }
        label { font-weight:600; color:#2c3e50; margin-bottom:6px; display:block; }
        input, select, textarea { width:100%; padding:10px; border-radius:6px; border:1px solid #ccc; margin-bottom:18px; font-size:14px; }
        textarea { resize:none; }
        .section { margin-top:35px; }
        .section h3 { margin-bottom:12px; color:#34495e; border-left:5px solid #1abc9c; padding-left:10px; }
        .submit-btn { width:100%; margin-top:30px; padding:14px; background:#1abc9c; color:white; font-size:17px; font-weight:bold; border:none; border-radius:6px; cursor:pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>AI-Based Student Feedback System</h2>
        <p>Your feedback is confidential and used only for institutional improvement</p>
    </div>

    <div class="form-body">
        <form method="POST" action="/save">
            <!-- BASIC DETAILS -->
            <div class="row">
                <div class="col">
                    <label>Student Name</label>
                    <input type="text" name="student_name" required>
                </div>
                <div class="col">
                    <label>Roll Number</label>
                    <input type="text" name="roll_number" required>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <label>Department</label>
                    <select name="department" required>
                        <option value="">Select</option>
                        <option>CSE</option>
                        <option>AIML</option>
                        <option>ECE</option>
                        <option>EEE</option>
                        <option>Mechanical</option>
                        <option>Civil</option>
                    </select>
                </div>
                <div class="col">
                    <label>Semester</label>
                    <select name="semester" required>
                        <option value="">Select</option>
                        <option>1</option><option>2</option><option>3</option>
                        <option>4</option><option>5</option><option>6</option>
                        <option>7</option><option>8</option>
                    </select>
                </div>
            </div>

            <!-- FEEDBACK SECTIONS -->
            <div class="section">
                <h3>📚 Academic Feedback</h3>
                <textarea name="academic_feedback" rows="3" maxlength="250" placeholder="Share your academic experience..." required></textarea>
            </div>

            <div class="section">
                <h3>🏫 Campus Facilities Feedback</h3>
                <textarea name="campus_feedback" rows="3" maxlength="250" placeholder="Campus infrastructure, labs, classrooms..." required></textarea>
            </div>

            <div class="section">
                <h3>📖 Library Feedback</h3>
                <textarea name="library_feedback" rows="3" maxlength="250" placeholder="Library resources and environment..." required></textarea>
            </div>

            <div class="section">
                <h3>🍽️ Hostel / Canteen Feedback</h3>
                <textarea name="hostel_feedback" rows="3" maxlength="250" placeholder="Food quality, cleanliness..." required></textarea>
            </div>

            <div class="section">
                <h3>🧑‍💼 Administration Feedback</h3>
                <textarea name="admin_feedback" rows="3" maxlength="250" placeholder="Office support and communication..." required></textarea>
            </div>

            <button class="submit-btn" type="submit">Submit All Feedback</button>
        </form>
    </div>
</div>

</body>
</html>
