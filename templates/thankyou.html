<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thank You</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body, html {
            height: 100%;
        }

        /* Fullscreen Background */
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #1abc9c, #16a085);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Card */
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 15px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 400px;
        }

        .card h1 {
            font-size: 26px;
            margin-bottom: 15px;
        }

        .card p {
            font-size: 16px;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        /* Buttons */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 10px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            color: white;
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255,255,255,0.3);
            transition: 0.3s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.5);
            color: #000;
        }

    </style>
</head>

<body>

<div class="container">

    <div class="card">
        <h1>✅ Thank You, {{ name }}!</h1>
        <p>Your feedback has been successfully submitted.</p>

        <div class="btn-container">
            <a href="/" class="btn">🏠 Go to Home</a>
            <a href="/feedback" class="btn">✍️ Submit Another Feedback</a>
        </div>
    </div>

</div>

</body>
</html>
